# 两种部署方式（都在 .env 里选，不需要改这个文件）：
#   A. 本机 / VPS 直接用 Caddy 自动 HTTPS：.env 里 COMPOSE_PROFILES=https，PORT=3000
#      docker compose up -d --build              → http://localhost:3000
#      docker compose --profile https up -d      → SITE_DOMAIN 的 HTTPS（Caddy）
#   B. Dokploy（Traefik 负责域名和 HTTPS）：.env 里 COMPOSE_PROFILES= 留空，PORT=127.0.0.1:3000
#      Caddy 不启动；web 仍保留端口映射，但只监听本机，Dokploy 的 Traefik 从容器网络访问 web:3000。
#   两种方式都保留 db/setup/api/worker/web 五个服务；数据库、API 不对公网开放。
name: aihot

x-app: &app
  build: .
  image: aihot-app
  restart: unless-stopped

x-backend: &backend
  <<: *app
  env_file: .env
  environment: &backend-env
    NODE_ENV: production
    DATABASE_URL: postgres://aihot:${POSTGRES_PASSWORD:-aihot}@db:5432/aihot
    AIHOT_DATA_DIR: /data
    API_BASE_URL: http://api:3001
    # No proxy in front limits pushes to /api/ingest/items: the api does (per client and minute; 0 turns it off).
    INGEST_RATE_LIMIT: ${INGEST_RATE_LIMIT:-10}
  volumes:
    - data:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aihot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aihot}
      POSTGRES_DB: aihot
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihot -d aihot"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Applies the database migrations and seeds the demo sources, then exits.
  setup:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "node scripts/migrate.ts && node scripts/seed.ts"]

  api:
    <<: *backend
    command: ["node", "apps/api/src/main.ts"]
    environment:
      <<: *backend-env
      API_HOST: 0.0.0.0
      API_PORT: "3001"
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["node", "apps/worker/src/main.ts"]
    # Let the worker drain backups and paid calls (STOP_TIMEOUT_MS, 470 s), then close its database.
    # Docker sends SIGTERM to the worker first; after this window it kills the remaining processes.
    stop_grace_period: 515s
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    <<: *app
    command: ["node", "apps/web/server.ts"]
    # SSR reads the API over HTTP; backend credentials and stored files stay in api/worker.
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AIHOT_RELEASE: ${AIHOT_RELEASE:-}
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    # 容器网络里固定 3000：Dokploy 的 Traefik（或 Caddy）按这个端口转发，
    # 即使 .env 把 PORT 设成 127.0.0.1:3000，也不影响容器之间的访问。
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started

  # 本机 HTTPS 用（.env 里 COMPOSE_PROFILES=https 才会启动）。
  # Dokploy 已有 Traefik，保留这个服务作为另一种部署方式，不要删。
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - web

volumes:
  db: {}
  data: {}
  caddy: {}
